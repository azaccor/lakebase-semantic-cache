# Deploys the app (server/ + frontend/), the Lakeflow pipelines (resources/pipelines.yml) and the
# Lakeflow Jobs that run the notebooks (resources/jobs.yml).
#
# Workspace-specific values are bundle variables with placeholder defaults. Supply yours either
# with --var, or as env vars (BUNDLE_VAR_catalog=..., BUNDLE_VAR_warehouse_id=...). The target has
# no `host`, so the workspace comes from --profile.
bundle:
  name: lakebase-semantic-cache

include:
  - resources/*.yml

variables:
  catalog:
    description: UC catalog holding cache_events, the eval tables and judge_results
    default: main
  schema:
    description: UC schema inside that catalog
    default: semantic_cache
  warehouse_id:
    description: SQL warehouse the app logs events and reads measurements through
    default: ""
  lakebase_project:
    description: Lakebase project (instance) holding the cache table
    default: semantic-cache
  llm_endpoint:
    description: Chat endpoint that answers cache misses
    default: databricks-claude-opus-4-8
  embedding_endpoint:
    description: Embedding endpoint (1024-d by default; see CacheConfig.dimensions)
    default: databricks-qwen3-embedding-0-6b
  sdk_wheel:
    description: databricks-lakebase-adapters wheel on a UC Volume, installed by the notebooks
    default: /Volumes/main/semantic_cache/libs/databricks_lakebase_adapters-<version>-py3-none-any.whl

sync:
  include:
    - wheels/*.whl          # gitignored, but the app installs the SDK from it
  exclude:
    - .venv/**
    - .node/**
    - node_modules/**
    - .isaac/**
    - server/static/**      # built on the platform by `npm run build`

resources:
  apps:
    semantic_cache_app:
      name: lakebase-semantic-cache
      description: "Semantic cache on Lakebase: ROI calculator, playground, false-hit judge"
      source_code_path: .
      config:
        command: ["python", "-m", "server.main"]
        env:
          - name: LAKEBASE_INSTANCE
            value: ${var.lakebase_project}
          - name: PG_SCHEMA
            value: semantic_cache
          - name: CACHE_BACKEND
            value: pgvector
          - name: UC_CATALOG
            value: ${var.catalog}
          - name: UC_SCHEMA
            value: ${var.schema}
          - name: LLM_ENDPOINT
            value_from: llm-endpoint
          - name: EMBEDDING_ENDPOINT
            value_from: embedding-endpoint
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: GENIE_SPACE_ID
            value_from: genie-space
      resources:
        - name: llm-endpoint
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: CAN_QUERY
        - name: embedding-endpoint
          serving_endpoint:
            name: ${var.embedding_endpoint}
            permission: CAN_QUERY
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: cache-insights
            space_id: ${resources.genie_spaces.cache_insights.id}
            permission: CAN_RUN
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project}/branches/production
            database: projects/${var.lakebase_project}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE

targets:
  dev:
    default: true
